# Course lab services, isolated from the existing student-* environment.
name: cba-a2-delivery
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: lab
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["delivery_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d lab"]
      interval: 5s
      timeout: 5s
      retries: 20
  python:
    build: ./python
    environment:
      PGHOST: postgres
      PGUSER: student
      PGPASSWORD: student
      PGDATABASE: lab
    volumes: ["./workspace:/workspace"]
    ports: ["127.0.0.1:8089:8000"]
    command: ["python", "-m", "http.server", "8000", "--directory", "/workspace/delivery/site"]
    depends_on:
      postgres:
        condition: service_healthy
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports: ["127.0.0.1:8979:8978"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["delivery_cloudbeaver:/opt/cloudbeaver/workspace"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
    volumes: ["delivery_neo4j:/data"]
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["127.0.0.1:18123:8123", "127.0.0.1:19000:9000"]
    volumes: ["delivery_clickhouse:/var/lib/clickhouse"]
volumes:
  delivery_postgres:
  delivery_cloudbeaver:
  delivery_neo4j:
  delivery_clickhouse:
